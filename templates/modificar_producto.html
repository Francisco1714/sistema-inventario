<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificar Producto | Sistema de Inventario</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <header class="header">
        <h1>Sistema de Inventario</h1>
        <nav>
            <a href="{{ url_for('web.inicio') }}">Inicio</a>
            <a href="{{ url_for('web.listar_productos') }}">Productos</a>
        </nav>
    </header>

    <div class="container">
        <div class="form-container">
            <h2 style="margin-bottom: 1.5rem;">Modificar Producto</h2>
            {% if errores %}
                <div class="errores">
                    <ul>
                        {% for error in errores %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                </div>
            {% endif %}
            <form method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}">
                </div>
                <div class="form-group">
                    <label for="descripcion">Descripción:</label>
                    <input type="text" id="descripcion" name="descripcion" value="{{ producto.descripcion }}">
                </div>
                <div class="form-group">
                    <label for="precio">Precio (USD):</label>
                    <input type="number" id="precio" name="precio" step="0.01" min="0.01" value="{{ producto.precio }}">
                </div>
                <div class="form-group">
                    <label for="stock">Stock:</label>
                    <input type="number" id="stock" name="stock" min="0" value="{{ producto.stock }}">
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Guardar Cambios</button>
                    <a href="{{ url_for('web.listar_productos') }}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
